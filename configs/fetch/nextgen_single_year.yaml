# Historical nextgen settings; the direct single-year loop is disabled.
# Use scripts/nextgen_preflight.py and scripts/nextgen_cfbd_acquire.py.
nextgen_manifest_required: true
cache_dir: /groups/bsavoie2/tburton2/TDNet/fingerprint_nextgen/raw_cache/v1
api_key_file: .env
year: 2010
division: fbs
sleep_seconds: 0.25
snake_case: true
refresh: false
api_budget_limit: 24000
api_budget_ledger: /groups/bsavoie2/tburton2/TDNet/fingerprint_nextgen/results/cfbd_api_call_budget.json
max_retries: 2  # Three total outbound attempts at most.
strict_http_errors: true
endpoints:
  games: true
  game_team_stats: true
  stats_advanced_game: true
  havoc_game: true
  ppa_games: true
  talent: true
  returning: true
  recruiting_teams: true
  coaches: true
  teams_fbs: true
  roster: true
  recruiting_players: true
  venue: true
  weather: true
  # Evaluation sidecar remains separate from fingerprint inputs.
  lines: false
  pregame_wp: false
