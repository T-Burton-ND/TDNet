# Portable TDNet development and runtime environment.
# Run from the repository root: conda env create -f environment.yaml
name: gridiron
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Frozen roster checkpoints require the serializer ABI from this release.
      - scikit-learn==1.7.2
      - scipy==1.16.2
      # Install TDNet itself plus every supported local workflow: tests and
      # formatting, notebooks, interactive charts, and PyTorch neural models.
      - -e .[dev,notebooks,visualization,neural]
