overwrite: true
verbose: false
model_name: stat_percentile
model_path: models/stat/models/percentile/models/tdstat_percentile.pkl

params:
  seed: 42
  model_type: percentile
  objective: winner_upset
  upset_weight: 3.0
  prediction_margin_cap: 30.0
  percentile_ridge_alpha: 10.0
  center_target: true
  min_margin_scale: 7.0
  require_stat_features: false
  percentile_center: true
  feature_prefixes:
    - home_
    - away_
    - net_
