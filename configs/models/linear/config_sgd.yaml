model_name: sgd
model_type: sgd
loss_function: Composite
margin_temperature: 14.0
prediction_margin_cap: 30.0
favorite_confidence_scale: 4.0
huber_delta: 7.0
seed: 42

training:
  standardize: true
  use_sample_weights: false
  sample_weight_column:

params:
  loss: squared_error
  penalty: l2
  alpha: 0.0001
  max_iter: 2000
  tol: 0.001
  learning_rate: invscaling
  eta0: 0.01
  fit_intercept: true
