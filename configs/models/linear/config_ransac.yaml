model_name: ransac
model_type: ransac
loss_function: Composite
margin_temperature: 14.0
prediction_margin_cap: 30.0
favorite_confidence_scale: 4.0
huber_delta: 7.0
seed: 42

training:
  standardize: true
  use_sample_weights: false
  sample_weight_column:

params:
  min_samples: 0.5
  max_trials: 100
  stop_probability: 0.99
  residual_threshold:
  estimator_params:
    fit_intercept: true
