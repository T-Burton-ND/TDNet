global:
  seed: 23002
  trials_per_model: 24

artifacts:
  train_artifacts: false
  season_eval: false
  model_configs: false
  tracebacks: false
  cleanup_runs_after_merge: true

fingerprints:
  labels: [v1.1, v1.2, v1.3, v1.4, v1.5, v1.6, v1.7]

feature_truncation:
  top_k: [25, 50, 100, 200, all]
  shap_importance_path: data/experiments/opponent_adjusted_ablation_shap/summary/tables/master_shap_importance.csv

score_weights:
  season_winner_winner_accuracy: 0.38
  season_winner_upset_recall: 0.38
  season_winner_disagreement_accuracy: 0.10
  season_winner_chalk_accuracy: 0.09
  score_margin_score: 0.05

families:
  stat:
    trials: 20
    params:
      params.objective: {type: categorical, choices: [winner_upset]}
      params.upset_weight: {type: float, low: 2.0, high: 10.0}
      params.prediction_margin_cap: {type: float, low: 16.0, high: 44.0}
      params.min_margin_scale: {type: float, low: 5.0, high: 18.0}
      params.center_target: {type: categorical, choices: [true, false]}
  linear:
    trials: 28
    params:
      config.loss_function: {type: categorical, choices: [hybrid_winner_accuracy]}
      config.margin_temperature: {type: float, low: 6.0, high: 24.0}
      config.prediction_margin_cap: {type: float, low: 16.0, high: 44.0}
      config.favorite_confidence_scale: {type: float, low: 1.0, high: 9.0}
      config.winner_upset_weight: {type: float, low: 2.0, high: 10.0}
      config.loss_weights.gamma: {type: float, low: 2.0, high: 10.0}
      training.standardize: {type: categorical, choices: [true, false]}
  tree:
    trials: 28
    params:
      config.loss_function: {type: categorical, choices: [hybrid_winner_accuracy]}
      config.margin_temperature: {type: float, low: 6.0, high: 24.0}
      config.prediction_margin_cap: {type: float, low: 16.0, high: 44.0}
      config.favorite_confidence_scale: {type: float, low: 1.0, high: 9.0}
      config.winner_upset_weight: {type: float, low: 2.0, high: 10.0}
      config.loss_weights.gamma: {type: float, low: 2.0, high: 10.0}
  knn:
    trials: 24
    params:
      params.n_neighbors: {type: categorical, choices: [3, 5, 10, 20, 30, 50]}
      params.weights: {type: categorical, choices: [uniform, distance]}
      params.metric: {type: categorical, choices: [euclidean, manhattan]}

models:
  ridge:
    params:
      params.alpha: {type: float, low: 0.0001, high: 1000.0, log: true}
  lasso:
    params:
      params.alpha: {type: float, low: 0.00001, high: 1.0, log: true}
      params.selection: {type: categorical, choices: [cyclic, random]}
  elastic_net:
    params:
      params.alpha: {type: float, low: 0.00001, high: 1.0, log: true}
      params.l1_ratio: {type: float, low: 0.05, high: 0.95}
      params.selection: {type: categorical, choices: [cyclic, random]}
  huber:
    params:
      params.alpha: {type: float, low: 0.000001, high: 0.1, log: true}
      params.epsilon: {type: float, low: 1.05, high: 2.5}
  bayesian:
    params:
      params.alpha_1: {type: float, low: 0.000001, high: 0.01, log: true}
      params.lambda_1: {type: float, low: 0.000001, high: 0.01, log: true}
  ard:
    params:
      params.alpha_1: {type: float, low: 0.000001, high: 0.01, log: true}
      params.lambda_1: {type: float, low: 0.000001, high: 0.01, log: true}
      params.threshold_lambda: {type: float, low: 100.0, high: 10000.0, log: true}
  ransac:
    params:
      params.min_samples: {type: float, low: 0.25, high: 0.9}
      params.max_trials: {type: int, low: 50, high: 300}
  orthogonal_matching_pursuit:
    params:
      params.n_nonzero_coefs: {type: int, low: 10, high: 200}
  sgd:
    params:
      params.alpha: {type: float, low: 0.000001, high: 0.1, log: true}
      params.eta0: {type: float, low: 0.0001, high: 0.1, log: true}
      params.penalty: {type: categorical, choices: [l2, l1, elasticnet]}
  passive_aggressive:
    params:
      params.C: {type: float, low: 0.001, high: 10.0, log: true}
  random_forest:
    params:
      params.n_estimators: {type: int, low: 200, high: 1200}
      params.max_depth: {type: categorical, choices: [null, 8, 12, 18, 24, 32]}
      params.min_samples_leaf: {type: int, low: 1, high: 20}
      params.min_samples_split: {type: int, low: 2, high: 80}
      params.max_features: {type: categorical, choices: [sqrt, log2, 0.35, 0.5, 0.75]}
      params.bootstrap: {type: categorical, choices: [true, false]}
      params.n_jobs: {type: categorical, choices: [1]}
  extra_trees:
    params:
      params.n_estimators: {type: int, low: 200, high: 1200}
      params.max_depth: {type: categorical, choices: [null, 8, 12, 18, 24, 32]}
      params.min_samples_leaf: {type: int, low: 1, high: 20}
      params.min_samples_split: {type: int, low: 2, high: 80}
      params.max_features: {type: categorical, choices: [sqrt, log2, 0.35, 0.5, 0.75]}
      params.bootstrap: {type: categorical, choices: [true, false]}
      params.n_jobs: {type: categorical, choices: [1]}
  gradient_boosted:
    params:
      params.n_estimators: {type: int, low: 100, high: 900}
      params.learning_rate: {type: float, low: 0.005, high: 0.2, log: true}
      params.max_depth: {type: int, low: 2, high: 6}
      params.min_samples_leaf: {type: int, low: 2, high: 40}
      params.subsample: {type: float, low: 0.55, high: 1.0}
  knn_uniform:
    params: {}
  knn_distance:
    params: {}
