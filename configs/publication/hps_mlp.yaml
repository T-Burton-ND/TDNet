version: 2
experiment_name: publication_hps_mlp_v2
artifact_root: publication_artifacts
objectives: [margin, winner]
feature_tiers: [F0, F1, F2, F3, F4, F5, F6, F7]
model_levels: [M5]
model_configs:
  M5: configs/models/neural/config_mlp.yaml
model_families:
  M5: neural
split_configs: [configs/splits/rolling_origin.yaml]
seeds: [1701, 2718, 3141]
parameter_search:
  seed: 26051
  trials_per_level: {M5: 48}
  spaces:
    M5:
      config.hidden_layers: {type: categorical, choices: [[32], [64], [128], [64, 32], [128, 64], [128, 128], [256, 128, 64], [128, 128, 64, 32]]}
      config.activation: {type: categorical, choices: [relu, gelu]}
      config.dropout: {type: categorical, choices: [0.0, 0.1, 0.25, 0.4]}
      config.normalization: {type: categorical, choices: [none, batch_norm, layer_norm]}
      config.weight_decay: {type: categorical, choices: [0.0, 0.000001, 0.00001, 0.0001, 0.001]}
      config.learning_rate: {type: categorical, choices: [0.0001, 0.0003, 0.001, 0.003]}
      config.batch_size: {type: categorical, choices: [32, 64, 128, 256]}
      config.quantile_transform: {type: categorical, choices: [false, true]}
      config.loss: {type: categorical, choices: [huber, mse, mae]}
worker:
  chunk_size: 16
  nslots: 16
  internal_threads: 1
  fragment_format: parquet
  process_workers: 16
  max_array_concurrency: 1
sge:
  parallel_environment: smp
  slots: 16
  walltime: '48:00:00'
  memory_gb: 64
  one_task_uses_all_slots: true
  thread_controls: {OMP_NUM_THREADS: 1, MKL_NUM_THREADS: 1, OPENBLAS_NUM_THREADS: 1, NUMEXPR_NUM_THREADS: 1}
guardrails: {minimum_free_gb: 30, reject_2026_training: true, require_smoke_test_marker: true}
