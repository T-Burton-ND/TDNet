name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install TDNet
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,visualization]"
      - name: Run tests
        env:
          MPLCONFIGDIR: /tmp/tdnet-matplotlib
        run: pytest -q
      - name: Verify release manifest
        run: python -m gridiron_ml.cli.publication.verify_release_candidate --manifest FREEZE_MANIFEST.json
